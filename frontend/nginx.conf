server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver — resolves upstream at request time,
    # not at startup. This prevents nginx failing when backend isn't ready yet.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8000;

    # Proxy API requests to the backend container (internal Docker network)
    location /api/ {
        proxy_pass         $backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        client_max_body_size 60M;
    }

    # Proxy health check endpoint
    location /health {
        proxy_pass         $backend;
        proxy_set_header   Host              $host;
    }

    # Proxy auth requests to the backend container
    location /auth/ {
        proxy_pass         $backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Proxy WebSocket with upgrade headers
    location /ws {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Serve static frontend files
    location / {
        try_files $uri $uri/ =404;
    }
}
