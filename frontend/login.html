<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InterNetworks HoneyDash | Sign In</title>

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="plugins/fontawesome-free/css/all.min.css">
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="plugins/icheck-bootstrap/icheck-bootstrap.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="dist/css/adminlte.min.css">
  <link rel="stylesheet" href="dist/css/dark-theme.css">
  <!-- InterNetworks HoneyDash enterprise theme (shared design system) -->
  <link rel="stylesheet" href="enterprise.css">
  <style>
    /* Page-specific layout only; components inherit enterprise.css */
    body.login-page {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      height: 100vh !important;
      min-height: 100vh;
      background: var(--hd-bg) !important;
      font-family: 'Source Sans Pro', sans-serif !important;
    }
    .login-box { width: 380px; }
    .login-logo { margin-bottom: 16px; }
    .login-logo a {
      color: var(--hd-text) !important;
      font-size: 1.8rem; font-weight: 700; letter-spacing: .005em;
    }
    .login-logo a i { color: var(--hd-blue3); margin-right: 9px; }
    .login-logo a b { color: var(--hd-text); font-weight: 700; }
    .login-logo small {
      display: block; font-size: 10px; color: var(--hd-text3);
      text-transform: uppercase; letter-spacing: .18em; margin-top: 4px; font-weight: 600;
    }
    .login-box .card {
      background: var(--hd-surface) !important;
      border: 1px solid var(--hd-border2) !important;
      border-radius: 8px !important;
      box-shadow: 0 16px 48px rgba(0,0,0,.5) !important;
    }
    .login-card-body { background: transparent !important; }
    .login-box-msg { color: var(--hd-text2) !important; font-size: 13px !important; }
    /* "Remember me" is a control label, not a field label — keep it readable */
    .icheck-primary label {
      color: var(--hd-text2) !important; font-size: 12px !important;
      text-transform: none !important; letter-spacing: normal !important;
      font-weight: 400 !important; margin-bottom: 0 !important;
    }
  </style>
</head>

<body class="hold-transition login-page">
  <div class="login-box">
    <div class="login-logo">
      <a href="dashboard.html"><i class="fas fa-shield-alt"></i>InterNetworks <b>Honey</b>Dash<small>Threat Intelligence Platform</small></a>
    </div>
    <!-- /.login-logo -->
    <div class="card">
      <div class="card-body login-card-body">
        <p class="login-box-msg">Sign in to start your session</p>

        <div id="loginError" class="alert alert-danger d-none" role="alert">
          Invalid email or password.
        </div>

        <form id="loginForm">
          <div class="input-group mb-3">
            <input type="email" id="loginEmail" class="form-control" placeholder="Email" required>
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-envelope"></span>
              </div>
            </div>
          </div>
          <div class="input-group mb-3">
            <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
            <div class="input-group-append">
              <div class="input-group-text">
                <span class="fas fa-lock"></span>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-8">
              <div class="icheck-primary">
                <input type="checkbox" id="remember">
                <label for="remember">Remember Me</label>
              </div>
            </div>
            <div class="col-4">
              <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
                Sign In
              </button>
            </div>
          </div>
        </form>

        <p class="mt-3 mb-0 text-muted text-center" style="font-size:11px;">
          Contact your system administrator for access.
        </p>
      </div>
      <!-- /.login-card-body -->
    </div>
  </div>
  <!-- /.login-box -->

  <!-- jQuery -->
  <script src="plugins/jquery/jquery.min.js"></script>
  <!-- Bootstrap 4 -->
  <script src="plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
  <!-- AdminLTE App -->
  <script src="dist/js/adminlte.min.js"></script>
  <script src="config.js"></script>

  <script>
    const API_BASE = window._HD_API;

    // Redirect to dashboard if already logged in
    if (localStorage.getItem('hd_token')) {
      window.location.href = 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errBox = document.getElementById('loginError');
      errBox.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      try {
        const resp = await fetch(`${API_BASE}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value,
          }),
        });

        if (!resp.ok) {
          errBox.classList.remove('d-none');
          return;
        }

        const data = await resp.json();
        localStorage.setItem('hd_token', data.access_token);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errBox.textContent = 'Cannot reach server. Is the backend running?';
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>

</html>
